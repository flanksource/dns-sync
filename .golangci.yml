# golangci-lint configuration file
# See https://golangci-lint.run/usage/configuration/

version: "2"

linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - goconst
    - gocyclo
    - gosec
    - revive

  exclusions:
    rules:
      - linters:
          - gosec
        text: G115

formatters:
  enable:
    - gofmt
    - goimports

run:
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
